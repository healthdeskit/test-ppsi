services:
  - type: web
    name: ppsi-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ADMIN_PASSWORD
        value: change-me-in-render-dashboard
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: ppsi-data
      mountPath: /app/data
      sizeGB: 1
    plan: starter
