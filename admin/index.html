<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | PPSI</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f0f6fb; color: #1a1a1a; }
    .header { background: #0f4c81; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 20px; }
    .header a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 14px; }
    .header a:hover { color: #fff; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    section { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(15,76,129,0.08); }
    h2 { margin: 0 0 16px; font-size: 18px; color: #0f4c81; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
    th { background: #f8fbfd; color: #0f4c81; font-weight: 600; }
    .payload { font-family: monospace; font-size: 12px; max-width: 400px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    .meta { color: #666; font-size: 12px; }
    .empty { color: #999; padding: 24px; text-align: center; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .badge-contact { background: #e3f2fd; color: #0f4c81; }
    .badge-appointment { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
  <div class="header">
    <h1>PPSI Admin</h1>
    <a href="/admin/logout">Log out</a>
  </div>
  <div class="container">
    <section>
      <h2>Form submissions (Contact &amp; Appointment)</h2>
      <div id="submissions-loading">Loading…</div>
      <div id="submissions-empty" class="empty" style="display:none;">No submissions yet.</div>
      <table id="submissions-table" style="display:none;">
        <thead>
          <tr><th>Date</th><th>Type</th><th>Details</th></tr>
        </thead>
        <tbody id="submissions-tbody"></tbody>
      </table>
    </section>
    <section>
      <h2>Medical record requests</h2>
      <div id="medical-loading">Loading…</div>
      <div id="medical-empty" class="empty" style="display:none;">No medical record requests yet.</div>
      <table id="medical-table" style="display:none;">
        <thead>
          <tr><th>Date</th><th>Details</th></tr>
        </thead>
        <tbody id="medical-tbody"></tbody>
      </table>
    </section>
    <section>
      <h2>Job applications</h2>
      <div id="jobs-loading">Loading…</div>
      <div id="jobs-empty" class="empty" style="display:none;">No job applications yet.</div>
      <table id="jobs-table" style="display:none;">
        <thead>
          <tr><th>Date</th><th>Position</th><th>Applicant</th><th>Details</th></tr>
        </thead>
        <tbody id="jobs-tbody"></tbody>
      </table>
    </section>
  </div>
  <script>
    const base = window.location.pathname.replace(/\/admin\/?$/, '') + '/admin';
    function getSubmissions() {
      fetch(base + '/api/submissions', { credentials: 'same-origin' })
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(rows => {
          document.getElementById('submissions-loading').style.display = 'none';
          if (!rows.length) {
            document.getElementById('submissions-empty').style.display = 'block';
            return;
          }
          document.getElementById('submissions-table').style.display = 'table';
          const tbody = document.getElementById('submissions-tbody');
          tbody.innerHTML = rows.map(r => {
            let payload = {};
            try { payload = JSON.parse(r.payload); } catch (_) {}
            const details = Object.entries(payload).map(([k,v]) => k + ': ' + (v || '—')).join('\n');
            const typeClass = r.type === 'contact' ? 'badge-contact' : 'badge-appointment';
            return '<tr><td class="meta">' + r.created_at + '</td><td><span class="badge ' + typeClass + '">' + r.type + '</span></td><td><div class="payload">' + (details || '—') + '</div></td></tr>';
          }).join('');
        })
        .catch(() => { document.getElementById('submissions-loading').textContent = 'Failed to load.'; });
    }
    function getMedical() {
      fetch(base + '/api/medical-requests', { credentials: 'same-origin' })
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(rows => {
          document.getElementById('medical-loading').style.display = 'none';
          if (!rows.length) {
            document.getElementById('medical-empty').style.display = 'block';
            return;
          }
          document.getElementById('medical-table').style.display = 'table';
          const tbody = document.getElementById('medical-tbody');
          tbody.innerHTML = rows.map(r => {
            let payload = {};
            try { payload = JSON.parse(r.payload); } catch (_) {}
            const details = Object.entries(payload).map(([k,v]) => k + ': ' + (v || '—')).join('\n');
            return '<tr><td class="meta">' + r.created_at + '</td><td><div class="payload">' + (details || '—') + '</div></td></tr>';
          }).join('');
        })
        .catch(() => { document.getElementById('medical-loading').textContent = 'Failed to load.'; });
    }
    function getJobs() {
      fetch(base + '/api/jobs', { credentials: 'same-origin' })
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(rows => {
          document.getElementById('jobs-loading').style.display = 'none';
          if (!rows.length) {
            document.getElementById('jobs-empty').style.display = 'block';
            return;
          }
          document.getElementById('jobs-table').style.display = 'table';
          const tbody = document.getElementById('jobs-tbody');
          tbody.innerHTML = rows.map(r => {
            const pos = (r.job_title || r.job_id || '—');
            const applicant = (r.name || '') + ' · ' + (r.email || '');
            const details = (r.phone || '') + (r.resume_file ? ' · Resume: ' + r.resume_file : '');
            return '<tr><td class="meta">' + (r.created_at || '') + '</td><td><strong>' + pos + '</strong></td><td>' + applicant + '</td><td><div class="payload">' + details + '</div></td></tr>';
          }).join('');
        })
        .catch(() => { document.getElementById('jobs-loading').textContent = 'Failed to load.'; });
    }
    getSubmissions();
    getMedical();
    getJobs();
  </script>
</body>
</html>
