<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | PPSI Control center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(145deg, #082a47 0%, #0f4c81 42%, #0a355a 100%);
    }
    .panel {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 20px;
      padding: 36px 32px 40px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    }
    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
      padding: 16px;
      background: #fff;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    .logo-wrap img { max-width: 220px; height: auto; max-height: 56px; object-fit: contain; }
    h1 {
      margin: 0 0 6px;
      font-family: "Sora", sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0a355a;
      text-align: center;
    }
    .sub {
      margin: 0 0 28px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #334155; }
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 20px;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: #0f4c81; box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.15); background: #fff; }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(180deg, #1268a8 0%, #0f4c81 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(15, 76, 129, 0.35);
    }
    button:hover { filter: brightness(1.05); }
    .hint {
      margin: 18px 0 0;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      text-align: center;
    }
    .hint code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; font-size: 11px; }
    .error {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      border: 1px solid #fecaca;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="logo-wrap">
      <img src="/assets/ppsi-logo.webp" alt="Precision Pain &amp; Spine Institute" width="220" height="60" />
    </div>
    <h1>Control center</h1>
    <p class="sub">Staff sign-in for leads, jobs &amp; records</p>
    <div class="error" id="err">Invalid password.</div>
    <form method="post" action="/admin/login">
      <label for="pw">Password</label>
      <input type="password" id="pw" name="password" required autocomplete="current-password" placeholder="Enter admin password" />
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">Password = <code>ADMIN_PASSWORD</code> in <code>server/.env</code></p>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('error') === '1') document.getElementById('err').classList.add('show');
  </script>
</body>
</html>
